<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MAFriends Stories</title>

  <!-- React -->
  <script
    src="https://unpkg.com/react@18/umd/react.development.js"
  ></script>

  <!-- ReactDOM -->
  <script
    src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
  ></script>

  <!-- Babel -->
  <script
    src="https://unpkg.com/@babel/standalone/babel.min.js"
  ></script>

  <style>

    body {
      margin: 0;
      padding: 30px;

      background: #323339;
      color: #dbdee1;

      font-family:
        Inter,
        Arial,
        sans-serif;
    }

    h1 {
      color: white;
      margin-bottom: 30px;
    }

    .story {
      background: #2b2d31;

      border-radius: 8px;

      padding: 20px;
      margin-bottom: 20px;
    }

    .story h2 {
      margin-top: 0;

      color: white;
    }

    .story-error {
      color: #f23f43;
      white-space: pre-wrap;
    }

  </style>

</head>


<body>

  <h1>MAFriends Stories</h1>

  <div id="stories">
    Loading stories...
  </div>


  <script>

    /*
      ========================================
      STORY FILES
      ========================================
    */

    const storyFiles = {

      mafmzab:
        "mafmzab.jsx",

      arsikk0:
        "arsikk0.jsx",

      _sillyness:
        "_sillyness.jsx",

      "shino_ena.":
        "shino_ena..jsx",

      definitelyreen:
        "definitelyreen.jsx"

    };


    /*
      ========================================
      STORY DISPLAY NAMES
      ========================================
    */

    const storyNames = {

      mafmzab:
        "M.A.F. 2.0",

      arsikk0:
        "Arsikk",

      _sillyness:
        "Krissy",

      "shino_ena.":
        "Kea",

      definitelyreen:
        "Zaffy/Reen"

    };


    /*
      ========================================
      GLOBAL STORY REGISTRY
      ========================================
    */

    window.friendStories = {};


    /*
      ========================================
      LOAD STORY
      ========================================
    */

    async function loadStory(name) {

  const file = storyFiles[name];

  const response = await fetch(
    file + "?v=" + Date.now()
  );

  if (!response.ok) {
    throw new Error(
      `HTTP ${response.status} while loading ${file}`
    );
  }

  const source = await response.text();

  /*
    Convert JSX → normal JavaScript.
  */

  const transformed = Babel.transform(
    source,
    {
      presets: ["react"]
    }
  ).code;


  /*
    Execute the transformed JavaScript
    directly.

    React and window are supplied explicitly.
  */

  const executeStory = new Function(
    "React",
    "window",
    transformed
  );

  executeStory(
    React,
    window
  );


  /*
    The story file should have registered
    itself here.
  */

  const Story =
    window.friendStories[name];

  if (typeof Story !== "function") {

    console.log(
      "Story registration debug:",
      name,
      window.friendStories
    );

    throw new Error(
      `Story "${name}" did not register a React component.`
    );
  }

  return Story;
}
      const source =
        await response.text();


      /*
        Convert JSX into normal JavaScript.
      */

      const transformed =
        Babel.transform(
          source,
          {
            presets: ["react"]
          }
        ).code;


      /*
        Run the transformed story.
      */

      const script =
        document.createElement("script");

      script.textContent =
        transformed;

      document.body.appendChild(script);


      /*
        Make sure the story registered itself.
      */

      const Story =
        window.friendStories[name];

      if (
        typeof Story !== "function"
      ) {

        throw new Error(
          `Story "${name}" did not register a React component.`
        );

      }

      return Story;
    }


    /*
      ========================================
      LOAD ALL STORIES
      ========================================
    */

    async function loadAllStories() {

      const container =
        document.getElementById("stories");

      container.innerHTML = "";


      for (
        const name of Object.keys(storyFiles)
      ) {

        const section =
          document.createElement("section");

        section.className =
          "story";


        const heading =
          document.createElement("h2");

        heading.textContent =
          storyNames[name];

        section.appendChild(
          heading
        );


        try {

          const Story =
            await loadStory(name);


          /*
            Create a React root
            inside this story's section.
          */

          const rootElement =
            document.createElement("div");

          section.appendChild(
            rootElement
          );


          const root =
            ReactDOM.createRoot(
              rootElement
            );


          root.render(
            React.createElement(Story)
          );


        } catch (error) {

          const errorElement =
            document.createElement("div");

          errorElement.className =
            "story-error";

          errorElement.textContent =
            "Failed to load story: " +
            error.message;

          section.appendChild(
            errorElement
          );

          console.error(
            "Failed to load story:",
            name,
            error
          );

        }


        container.appendChild(
          section
        );

      }

    }


    /*
      ========================================
      START
      ========================================
    */

    loadAllStories();

  </script>

</body>

</html>
